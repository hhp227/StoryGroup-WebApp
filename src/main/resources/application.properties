server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/storygroup}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true

# Supabase Session Pooler는 서버 풀이 15개뿐인데 Hikari 기본값(최대 10, idle도 10 유지)이면
# 인스턴스 하나가 10개를 계속 쥐고 있어 배포(구/신 리비전 동시 기동)나 Flyway가 커넥션을 못 얻는다
# (EMAXCONNSESSION, 2026-07-06 실제 발생). WebSocket 도입으로 인스턴스가 오래 살아있게 되면서
# 더 자주 터질 수 있어 풀을 줄이고 idle은 반납하게 한다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}

# DB는 snake_case(password_hash), Kotlin은 camelCase(passwordHash)를 쓰므로 자동 매핑에 필수.
# 이게 없으면 MyBatis가 컬럼명을 정확히 일치하는 이름으로만 매핑해서 대부분의 프로퍼티가 조용히 null이 됨.
mybatis.configuration.map-underscore-to-camel-case=true

# JWT_SECRET는 반드시 운영 환경에서 재정의할 것 (Secret Manager, SPRING_DATASOURCE_PASSWORD와 동일한 방식).
# 아래 기본값은 로컬 개발 전용이며 HS256 최소 요구 길이(256bit=32byte) 이상만 맞춘 임의 문자열이다.
jwt.secret=${JWT_SECRET:local-dev-only-secret-please-override-in-production-env-1234567890}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Supabase Storage (PRD 17번 Storage). service key는 운영에서 Secret Manager로 주입 -
# 기본값이 빈 문자열이면 업로드 엔드포인트가 "저장소 미설정" 에러를 반환한다(부팅은 정상).
app.storage.url=${SUPABASE_URL:https://cbqpgunrerbelxmtqrff.supabase.co}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:storygroup-files}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# WebRTC ICE 서버 구성(Phase 7 D10, /api/rtc/ice-servers). 지금은 STUN만 쓴다.
# 나중에 TURN 서버(coturn use-auth-secret)를 준비하면 TURN_URLS/TURN_SECRET env 두 개만
# 채우면 켜진다 — 코드/배포 파이프라인 변경 불필요. urls는 콤마 구분 목록.
app.rtc.stun-urls=${APP_RTC_STUN_URLS:stun:stun.l.google.com:19302}
app.rtc.turn-urls=${APP_RTC_TURN_URLS:}
app.rtc.turn-secret=${APP_RTC_TURN_SECRET:}
app.rtc.turn-credential-ttl-seconds=${APP_RTC_TURN_CREDENTIAL_TTL_SECONDS:43200}